name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Home Assistant 2026.8.3)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Run tests with coverage
        run: pytest --cov=custom_components.dockhand --cov-report=term-missing

  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install quality dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Check formatting
        run: ruff format --check custom_components tests
      - name: Run Ruff
        run: ruff check custom_components tests
      - name: Run mypy
        run: mypy custom_components/dockhand
      - name: Validate JSON and YAML metadata
        run: pytest tests/test_metadata.py
