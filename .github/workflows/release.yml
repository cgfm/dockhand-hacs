name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed or annotated version tag (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifact
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          version="$(jq -r '.version' custom_components/dockhand/manifest.json)"
          test "v${version}" = "${RELEASE_TAG}"
      - name: Build HACS artifact
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=dockhand/ \
            --output=dockhand.zip HEAD:custom_components/dockhand
      - name: Create GitHub release
        shell: bash
        run: >-
          gh release create "${RELEASE_TAG}" dockhand.zip
          --verify-tag --generate-notes --title "Dockhand ${RELEASE_TAG#v}"
